# Builds the Windows installer and publishes it as a GitHub Release when a
# version tag (v1.2.3) is pushed. Installed apps find the new release and
# update themselves.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não corresponde à versão $version do package.json"
            exit 1
          fi

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release page text: description, install steps, code signing policy and privacy.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

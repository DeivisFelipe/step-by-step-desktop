appId: com.stepbystep.code
productName: Step-by-Step Code
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{dist,dist-*,docs,.github}/**'
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
win:
  executableName: step-by-step-code
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Settings and lessons survive uninstalls and updates.
  deleteAppDataOnUninstall: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
# Linux: AppImage (runs anywhere, updates itself) and .deb (Debian, Ubuntu, Mint).
linux:
  target:
    - AppImage
    - deb
  executableName: step-by-step-code
  icon: build/icon.png
  maintainer: Deivis Felipe
  category: Education
  synopsis: Aulas de programação passo a passo
  description: Prepare aulas de programação com antecedência e apresente-as passo a passo, com digitação animada, terminal, slides e páginas para o OBS.
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
  depends:
    - libnotify4
    - libxtst6
    - libnss3
npmRebuild: false
# Releases on GitHub; installed apps check them for updates (electron-updater).
publish:
  provider: github
  owner: DeivisFelipe
  repo: step-by-step-desktop
  releaseType: release
